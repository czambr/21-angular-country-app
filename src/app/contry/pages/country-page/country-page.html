@if (countryResource.error() && !countryResource.hasValue()) {
  <app-not-found />
}

@if (countryResource.isLoading()) {
  <section class="flex flex-col w-full items-center content-center">
    <span class="loading loading-ring loading-xl w-52"></span>
  </section>
}

@if (countryResource.hasValue()) {
  <country-information [country]="countryResource.value()" />
}
